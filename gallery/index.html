  <div id="view" data-page="gallery">
    <header class="gbar">
      <a class="gback" href="/" aria-label="返回首页">&larr; <span>linsongりんそん</span></a>
      <span class="gbrand">Gallery</span>

    <div class="gwrap">
      <div class="ghead">
        <h1>Gallery</h1>
        <p>图片与瞬间的合集 —— VRChat、截图、生活与收藏。点击任意图片进入大图浏览，支持上一张 / 下一张、缩放与分享。</p>

        <div class="cats" id="cats"></div>

      </div>

      <div class="grid" id="grid"><div class="empty">加载中…</div></div>
    </div>
  </div>

  <div class="fxbar" id="fxbar">
    <button data-w="clear" aria-label="晴"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 3v2M12 19v2M3 12h2M19 12h2M5.6 5.6l1.4 1.4M17 17l1.4 1.4M18.4 5.6 17 7M7 17l-1.4 1.4"/></svg></button>
    <button data-w="cloudy" aria-label="阴"><svg viewBox="0 0 24 24"><path d="M7 18h10a3.5 3.5 0 0 0 .3-7 5 5 0 0 0-9.6-1A3.5 3.5 0 0 0 7 18z"/></svg></button>
    <button data-w="lightrain" aria-label="小雨"><svg viewBox="0 0 24 24"><path d="M7 16h10a3.5 3.5 0 0 0 .3-7 5 5 0 0 0-9.6-1A3.5 3.5 0 0 0 7 16z"/><path d="M10 19v1.5M14 19v1.5"/></svg></button>
    <button data-w="rain" aria-label="中雨"><svg viewBox="0 0 24 24"><path d="M7 16h10a3.5 3.5 0 0 0 .3-7 5 5 0 0 0-9.6-1A3.5 3.5 0 0 0 7 16z"/><path d="M9 19v2M12 19v2M15 19v2"/></svg></button>

  <div class="plist" id="plist" role="listbox" aria-label="播放列表"></div>

  <section class="playerbar" id="playerbar">
    <div class="art"><img id="artImg" src="/cover-lonely-day.jpg" alt="专辑封面"></div>
    <div class="meta">
      <div class="row1">
        <span class="t" id="ptitle">Lonely Day</span>
        <canvas class="eq" id="eq" aria-hidden="true"></canvas>
      </div>
      <div class="a" id="partist">Jurrivh</div>
      <div class="prow">
        <div class="ptrack" id="ptrack"><div class="pfill" id="pfill"></div></div>
        <span class="ptime" id="ptime">0:00 / 4:14</span>
      </div>
    </div>
    <div class="pctrl">
      <button class="pside" id="pprev" aria-label="上一首">
        <svg viewBox="0 0 24 24"><path d="M7 6h2.4v12H7zM19 6.4v11.2L11.2 12z"/></svg>
      </button>
      <button class="pbtn" id="pbtn" aria-label="播放 / 暂停">
        <svg viewBox="0 0 24 24">
          <path class="i-play" d="M8 5.2v13.6L19 12z"/>
          <path class="i-pause" d="M8 5.2h3.3v13.6H8zM12.7 5.2H16v13.6h-3.3z"/>
        </svg>
      </button>
      <button class="pside" id="pnext" aria-label="下一首">
        <svg viewBox="0 0 24 24"><path d="M14.6 6H17v12h-2.4zM5 6.4v11.2L12.8 12z"/></svg>
      </button>
    </div>
    <input class="vol" id="vol" type="range" min="0" max="100" value="18" aria-label="音量">
    <audio id="audio" preload="none"></audio>
  </section>

  <div class="hint" id="hint">点一下屏幕，音乐开始</div>

  <div class="keys" id="keys" role="dialog" aria-label="键盘快捷键">
    <div class="keys-head">
      <span>Shortcuts</span>
      <span class="keys-esc">ESC</span>
    </div>
    <ul>
      <li><kbd>Space</kbd><span>播放 / 暂停</span></li>
      <li><kbd>←</kbd><kbd>→</kbd><span>上一首 / 下一首</span></li>
      <li><kbd>↑</kbd><kbd>↓</kbd><span>音量</span></li>
      <li><kbd>M</kbd><span>静音</span></li>
      <li><kbd>L</kbd><span>播放列表</span></li>
      <li><kbd>?</kbd><span>打开 / 关闭本面板</span></li>
    </ul>
  </div>
